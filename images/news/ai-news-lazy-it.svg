  <ellipse cx="345" cy="390" rx="155" ry="128" fill="#2f6f87"/>
  <circle cx="330" cy="270" r="72" fill="#f0b07a"/>
  <path d="M270 255q20-90 120-50 33 13 26 62-22-32-64-29-50 5-82 17z" fill="#5b321f"/>
  <rect x="276" y="252" width="50" height="29" rx="12" fill="none" stroke="#20272b" stroke-width="8"/>
  <rect x="344" y="252" width="50" height="29" rx="12" fill="none" stroke="#20272b" stroke-width="8"/>
  <line x1="326" y1="265" x2="344" y2="265" stroke="#20272b" stroke-width="7"/>
  <path d="M312 305q22 15 46 0" fill="none" stroke="#7b3e2a" stroke-width="6" stroke-linecap="round"/>
