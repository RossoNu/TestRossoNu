  <path d="M425 345q38 15 73 63" fill="none" stroke="#2f6f87" stroke-width="45" stroke-linecap="round"/>
  <path d="M250 310q-32-45 17-83" fill="none" stroke="#2f6f87" stroke-width="30" stroke-linecap="round"/>

  <!-- ben/fötter på bordet -->
  <path d="M315 455q70 48 150 87" fill="none" stroke="#244b60" stroke-width="58" stroke-linecap="round"/>
  <path d="M370 445q92 33 185 72" fill="none" stroke="#244b60" stroke-width="58" stroke-linecap="round"/>
  <ellipse cx="510" cy="535" rx="75" ry="34" fill="#32383c" transform="rotate(13 510 535)"/>
  <ellipse cx="600" cy="522" rx="75" ry="34" fill="#32383c" transform="rotate(9 600 522)"/>
  <path d="M468 532h78M558 520h78" stroke="#6d7478" stroke-width="8" stroke-linecap="round"/>

  <!-- kaffemugg -->
  <rect x="495" y="382" width="65" height="76" rx="12" fill="#fff"/>
  <path d="M560 400q34 0 28 28-4 22-28 18" fill="none" stroke="#fff" stroke-width="13"/>
  <circle cx="517" cy="415" r="4" fill="#20272b"/>
  <circle cx="537" cy="415" r="4" fill="#20272b"/>
  <path d="M514 433q14 10 28 0" fill="none" stroke="#20272b" stroke-width="4" stroke-linecap="round"/>
  <path d="M515 374q-13-19 4-34M538 374q-13-19 4-34" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <!-- tangentbord/mus -->
  <rect x="705" y="520" width="270" height="58" rx="12" fill="#2d3539" transform="skewX(-8)"/>
  <g stroke="#5d686d" stroke-width="4">
    <path d="M720 538h225M715 554h225"/>
  </g>
  <ellipse cx="1010" cy="555" rx="35" ry="22" fill="#2d3539"/>

  <!-- block -->
  <rect x="925" y="580" width="190" height="72" rx="10" fill="#fff9e8" transform="rotate(-4 1020 616)"/>
  <text x="950" y="612" fill="#174457" font-family="system-ui, sans-serif" font-size="20" font-weight="700">NYHETSIDÉER</text>
  <path d="M950 628h115" stroke="#9e8f75" stroke-width="4"/>

  <!-- pratbubbla från teknikern -->
  <rect x="420" y="170" width="220" height="88" rx="32" fill="#fff" stroke="#d9e7ea" stroke-width="4"/>
  <path d="M505 258l-25 30 58-30" fill="#fff" stroke="#d9e7ea" stroke-width="4"/>
  <text x="455" y="205" fill="#174457" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Kan du fixa</text>
  <text x="455" y="233" fill="#174457" font-family="system-ui, sans-serif" font-size="21" font-weight="700">en nyhet också?</text>
</svg>