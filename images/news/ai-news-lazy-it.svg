<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI hjälper till att skriva nyheter på Rossö.nu</title>
  <desc id="desc">Humoristisk illustration av en avslappnad IT-tekniker med fötterna på bordet som pratar med en vänlig AI-assistent på en datorskärm.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f5f7"/>
      <stop offset="1" stop-color="#f7ead7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174457"/>
      <stop offset="1" stop-color="#2f6f87"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="105" cy="105" r="62" fill="#dff1f4" opacity=".8"/>
  <circle cx="1110" cy="90" r="78" fill="#f6efe2" opacity=".9"/>

  <!-- anslagstavla -->
  <rect x="60" y="55" width="350" height="190" rx="20" fill="#b9865c"/>
  <rect x="85" y="82" width="90" height="65" rx="5" fill="#fff" transform="rotate(-4 130 115)"/>
  <rect x="205" y="78" width="110" height="76" rx="5" fill="#fff" transform="rotate(5 260 116)"/>
  <rect x="110" y="175" width="75" height="42" rx="5" fill="#ffd9e4"/>
  <path d="M135 192c8-13 23-4 23 6 0-10 15-19 23-6 8 14-23 28-23 28s-31-14-23-28z" fill="#d53b1d"/>
  <rect x="260" y="175" width="105" height="45" rx="5" fill="#bfe4ec"/>

  <!-- skrivbord -->
  <path d="M80 495h1040l-60 145H140z" fill="#b77b45"/>
  <path d="M130 505h930" stroke="#915d31" stroke-width="10" stroke-linecap="round" opacity=".45"/>

  <!-- skärm -->
  <rect x="660" y="110" width="455" height="330" rx="28" fill="#20272b"/>
  <rect x="680" y="130" width="415" height="285" rx="20" fill="url(#screen)"/>
  <rect x="835" y="440" width="105" height="35" rx="8" fill="#343d42"/>
  <rect x="780" y="470" width="215" height="18" rx="9" fill="#343d42"/>
  <text x="715" y="175" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">AI-nyhetshjälpen</text>
  <rect x="715" y="205" width="165" height="62" rx="28" fill="#fff" opacity=".94"/>
  <circle cx="755" cy="236" r="7" fill="#8da9b4"/>
  <circle cx="780" cy="236" r="7" fill="#8da9b4"/>
  <circle cx="805" cy="236" r="7" fill="#8da9b4"/>
  <rect x="715" y="285" width="190" height="58" rx="26" fill="#70d5ea" opacity=".95"/>
  <circle cx="755" cy="314" r="7" fill="#fff"/>
  <circle cx="780" cy="314" r="7" fill="#fff"/>
  <circle cx="805" cy="314" r="7" fill="#fff"/>

  <!-- AI-robot -->
  <circle cx="992" cy="275" r="78" fill="#f7fbfc"/>
  <rect x="936" y="230" width="112" height="88" rx="38" fill="#102c39"/>
  <circle cx="970" cy="270" r="10" fill="#71e7ff"/>
  <circle cx="1015" cy="270" r="10" fill="#71e7ff"/>
  <path d="M970 294q23 18 45 0" fill="none" stroke="#71e7ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="992" y1="198" x2="992" y2="177" stroke="#f7fbfc" stroke-width="8" stroke-linecap="round"/>
  <circle cx="992" cy="168" r="10" fill="#71e7ff"/>
  <path d="M1042 325q43 5 48-37" fill="none" stroke="#f7fbfc" stroke-width="19" stroke-linecap="round"/>
